[project]
name = "event-venue-operator"
version = "0.1.0"
description = "Agent memory demo on MongoDB Atlas, LangGraph, and Voyage embeddings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.1.0",
    "langchain-mongodb>=0.2.0",
    "langchain-voyageai>=0.1.0",
    "langgraph-checkpoint-mongodb>=0.1.0",
    "langgraph-store-mongodb>=0.1.0",
    "pymongo>=4.6.0",
    "motor>=3.3.0",
    "anthropic>=0.40.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "langfuse>=2.50.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "voyageai>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_venue_operator"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
